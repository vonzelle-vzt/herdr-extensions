# herdr-extensions — herdr plugin manifest. TEMPLATE: @@SPICEEDIT@@ and @@LAZYGIT@@ are replaced with
# absolute paths by `herdr-extensions install`. Do not hand-edit the installed copy; it is regenerated.
#
# LAYOUT this produces (prefix = ctrl+b), every panel toggling on repeat:
#   prefix+shift+e  editor panel, LEFT of the agent    (VS Code shift+cmd+E, explorer + editor)
#   prefix+shift+o  editor full-width in its own tab
#   prefix+shift+s  lazygit panel, BELOW the agent     (VS Code Source Control)
#
# 🔴 KEY CHOICE IS NOT COSMETIC. A [[keys.command]] entry silently OVERRIDES a herdr built-in --
# no warning, no log, the built-in just stops working. v0.1.0 shipped prefix+e / prefix+g /
# prefix+r and destroyed edit_scrollback, goto (the fuzzy space/tab/agent picker) and resize_mode
# on every machine that installed it. herdr reserves ~39 prefix bindings; `herdr-extensions
# doctor --keymap` re-derives that set from the installed binary and install refuses on a clash.
#
# WHY THE PATHS ARE TEMPLATED AND ABSOLUTE: the herdr server is launched by launchd, so it execs
# these pane commands with PATH=/usr/bin:/bin:/usr/sbin:/sbin. Neither /opt/homebrew/bin (Apple
# Silicon) nor /usr/local/bin (Intel) nor ~/.local/bin is on it — a bare `spiceedit` or `lazygit`
# fails to spawn with no useful error. Rendering at install time also makes one manifest correct on
# Apple Silicon, Intel, and Linux. (Contrast: herdr-plus PROJECT TAB commands are typed into an
# interactive shell and DO get the user's full PATH. Pane commands do not.)
#
# NOTE the Homebrew binary for SpiceEdit is `spiceedit` — no hyphen — though its tap is spice-edit.
id = "herdr-extensions"
name = "herdr-extensions"
version = "0.8.0"
description = "Tiny VS Code for herdr: editor + lazygit + problems/search/todo/blame/markdown/tests panels."
min_herdr_version = "0.7.0"
platforms = ["linux", "macos"]

# ---------------------------------------------------------------------------------------------
# Panes. `title` is LOAD-BEARING, not cosmetic: `herdr pane list` exposes no plugin_id/entrypoint,
# so "is my panel already open?" is answered by matching this exact title.
# ---------------------------------------------------------------------------------------------

[[panes]]
id = "editor"
title = "Edit"
placement = "split"
command = ["@@SPICEEDIT@@"]

[[panes]]
id = "editor-tab"
title = "Edit"
placement = "tab"
command = ["@@SPICEEDIT@@"]

# lazygit requires a git work tree as its cwd, so the launcher refuses to open this panel outside a
# repo rather than letting it error inside a pane.
[[panes]]
id = "git"
title = "Git"
placement = "split"
command = ["@@LAZYGIT@@"]

# ---------------------------------------------------------------------------------------------
# Panel bundle. Each is a plain bash script in libexec/, copied next to open-panel.sh at install
# time (see render_plugin() in bin/herdr-extensions) and referenced here by that same relative
# path — herdr execs [[panes]] commands with the plugin directory as cwd, same as `open-panel.sh`
# itself, so no @@-templating is needed for these (only spiceedit/lazygit are external binaries
# that need an absolute, machine-specific path). Every script prints to stdout and then waits for
# a keypress so the pane persists; it closes when the script exits.
# ---------------------------------------------------------------------------------------------

[[panes]]
id = "problems"
title = "Problems"
placement = "split"
command = ["bash", "problems"]

[[panes]]
id = "search"
title = "Search"
placement = "split"
command = ["bash", "search"]

[[panes]]
id = "todo"
title = "TODO"
placement = "split"
command = ["bash", "todo"]

[[panes]]
id = "debug"
title = "Debug"
placement = "split"
command = ["bash", "debug"]

[[panes]]
id = "blame"
title = "Blame"
placement = "split"
command = ["bash", "blame"]

[[panes]]
id = "markdown"
title = "Markdown"
placement = "split"
command = ["bash", "markdown"]

# The preview pane is TALLER than the other bottom panels (0.55) because it shows an image: a
# 35%-height strip of a rendered web page is not worth looking at.
[[panes]]
id = "preview"
title = "Preview"
placement = "split"
command = ["bash", "preview"]

[[panes]]
id = "tests"
title = "Tests"
placement = "split"
command = ["bash", "tests"]

# ---------------------------------------------------------------------------------------------
# Actions. open-panel.sh args:
#   <entrypoint> <label> <split|tab> <right|down> <key|auto> <swap> <size>
#
# <size> is the last arg and is why the editor panel is no longer half the screen: herdr's
# `plugin pane open` has NO --ratio (only `pane split` and `pane move` do), so every plugin panel
# opens at a hard 50/50. A number >= 1 is a COLUMN COUNT, converted against the live split and
# clamped so the panel can never land under SpiceEdit's 50-column draw minimum (which is what
# produces "Window too small - please resize") nor eat more than ~55% of the screen. A value
# below 1 is taken as a literal fraction, which is what the vertical git panel wants. OMITTING the
# argument leaves herdr's own sizing alone, which is correct for a full-width tab.
#
# 🔴 Do NOT pass "" for it. herdr rejects any empty argv entry with "command must contain non-empty
# argv strings" and marks the WHOLE manifest unavailable — every action in this file stops working,
# not just the one with the empty string.
#
# `swap = yes` swaps the new pane with the agent pane right after opening — that is how the editor
# ends up on the LEFT, because `plugin pane open --direction` accepts only right|down and there is
# no `left`. The git panel uses direction=down with swap=no, i.e. VS Code's bottom-panel position.
# ---------------------------------------------------------------------------------------------

[[actions]]
id = "open-editor"
platforms = ["linux", "macos"]
title = "Editor panel (left)"
description = "Toggle the SpiceEdit editor in a split to the left of the current pane."
command = ["bash", "open-panel.sh", "editor", "Edit", "split", "right", "key", "yes", "88", "70"]

[[actions]]
id = "open-editor-tab"
platforms = ["linux", "macos"]
title = "Editor (own tab)"
description = "Open SpiceEdit full-width in its own tab, or switch to it if already open."
command = ["bash", "open-panel.sh", "editor-tab", "Edit", "tab", "right", "key", "no"]

[[actions]]
id = "open-git"
platforms = ["linux", "macos"]
title = "Git panel (lazygit)"
description = "Toggle lazygit in a split below the current pane, rooted at the repo."
command = ["bash", "open-panel.sh", "git", "Git", "split", "down", "key", "no", "0.35"]

# ---------------------------------------------------------------------------------------------
# Panel bundle actions. All bottom panels (direction=down, swap=no), same shape as open-git above:
# a persistent VS-Code-style output panel rather than a left/right editor-adjacent split.
# ---------------------------------------------------------------------------------------------

# Divider nudge. herdr 0.7.5 has no mouse divider drag and its only built-in resize path is the
# modal `resize_mode` (prefix+r), so these are the missing middle: one keypress, one step, the way
# an IDE does it. Direction is where the DIVIDER moves, which stays predictable regardless of which
# pane has focus.
# Image input. Terminals carry text, not image bytes, so there is no way to paste a PNG into a pane --
# but an agent reads image PATHS natively, which reduces the whole problem to typing a path onto the
# prompt line. That works fully locally; herdr's own image paste is --remote only because it tries to
# bridge the clipboard itself.
[[actions]]
id = "open-preview"
platforms = ["linux", "macos"]
title = "Preview panel"
description = "Render the project's dev server inside a pane, refreshing automatically."
command = ["bash", "open-panel.sh", "preview", "Preview", "split", "down", "key", "no", "0.55"]

[[actions]]
id = "paste-image"
platforms = ["linux", "macos"]
title = "Paste an image to the agent"
description = "Stage the clipboard image (or the newest screenshot) and type its path into the agent pane."
command = ["bash", "image-paste.sh"]

[[actions]]
id = "resize-wider"
platforms = ["linux", "macos"]
title = "Move the split divider right"
description = "Nudge the divider between this pane and its neighbour one step to the right."
command = ["bash", "resize-pane.sh", "right", "0.05"]

[[actions]]
id = "resize-narrower"
platforms = ["linux", "macos"]
title = "Move the split divider left"
description = "Nudge the divider between this pane and its neighbour one step to the left."
command = ["bash", "resize-pane.sh", "left", "0.05"]

[[actions]]
id = "open-problems"
platforms = ["linux", "macos"]
title = "Problems panel"
description = "Toggle tsc/eslint/ruff diagnostics for the repo in a split below the current pane."
command = ["bash", "open-panel.sh", "problems", "Problems", "split", "down", "key", "no", "0.35"]

[[actions]]
id = "open-search"
platforms = ["linux", "macos"]
title = "Search panel"
description = "Toggle a ripgrep search across the repo in a split below the current pane."
command = ["bash", "open-panel.sh", "search", "Search", "split", "down", "key", "no", "0.35"]

[[actions]]
id = "open-todo"
platforms = ["linux", "macos"]
title = "TODO panel"
description = "Toggle a TODO/FIXME/HACK/XXX scan of the repo in a split below the current pane."
command = ["bash", "open-panel.sh", "todo", "TODO", "split", "down", "key", "no", "0.35"]

# The debugger is the single most-cited thing people lose moving off VS Code. This panel does not
# implement a debug adapter client — it finds an installed one, reuses the repo .vscode/launch.json,
# and hands off. Writing a DAP client is months of work for a worse result than koan-debugger.
[[actions]]
id = "open-debug"
platforms = ["linux", "macos"]
title = "Debug panel"
description = "Show launch configurations and hand off to an installed debug adapter."
command = ["bash", "open-panel.sh", "debug", "Debug", "split", "down", "key", "no", "0.45"]

[[actions]]
id = "open-blame"
platforms = ["linux", "macos"]
title = "Blame panel"
description = "Toggle git log/blame for the ACTIVE file in a split below the current pane."
command = ["bash", "open-panel.sh", "blame", "Blame", "split", "down", "key", "no", "0.35"]

[[actions]]
id = "open-markdown"
platforms = ["linux", "macos"]
title = "Markdown preview"
description = "Toggle a glow preview of the ACTIVE file in a split below the current pane."
command = ["bash", "open-panel.sh", "markdown", "Markdown", "split", "down", "key", "no", "0.35"]

[[actions]]
id = "open-tests"
platforms = ["linux", "macos"]
title = "Tests panel"
description = "Toggle the repo's vitest/jest/pytest run in a split below the current pane."
command = ["bash", "open-panel.sh", "tests", "Tests", "split", "down", "key", "no", "0.35"]

# ---------------------------------------------------------------------------------------------
# Auto-open the editor for every new workspace/project, so a project always comes up VS-Code-shaped
# without a keypress. Delegates to the SAME launcher the keybinding uses, so it can never produce a
# duplicate pane and always resolves the correct project cwd.
#
# `auto` (rather than `key`) changes two behaviors deliberately:
#   * a workspace that is NOT a git repo gets no editor at all — auto-opening $HOME dumps dozens of
#     dotfiles into the tree, which is noise, not a feature;
#   * focus is handed back to the agent pane afterwards, so your first keystrokes go to the agent.
#
# Workspace-scoped, NOT tab-scoped: hooking tab.created would spawn an editor beside every new tab.
# A new git worktree also creates a workspace, so this fires there too.
[[events]]
on = "workspace.created"
command = ["bash", "open-panel.sh", "editor", "Edit", "split", "right", "auto", "yes", "88", "70"]
